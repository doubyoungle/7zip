name: smart-extract

on:
  push:
    branches:
      - 'feature/smart-extract'
  pull_request:
    branches:
      - 'feature/smart-extract'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare htmlhelp.lib (x64 and x86 import libraries for HtmlHelpW)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _libs\x86 | Out-Null
          $kitLib = "C:\Program Files (x86)\Windows Kits\10\Lib"
          foreach ($arch in @('x64', 'x86')) {
            $found = Get-ChildItem -Path $kitLib -Recurse -Filter "hhctrl.lib" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*\um\$arch*" } |
                     Sort-Object FullName -Descending | Select-Object -First 1
            $out = if ($arch -eq 'x64') { '_libs\htmlhelp.lib' } else { '_libs\x86\htmlhelp.lib' }
            if ($found) {
              Copy-Item $found.FullName $out
              Write-Host "$arch : copied htmlhelp import library from $($found.FullName)"
            } else {
              Write-Host "$arch : hhctrl.lib not found in Windows SDK, generating import library"
              $def = "_libs\hhctrl-$arch.def"
              $defLines = @('LIBRARY HHCTRL.OCX', 'EXPORTS', '    HtmlHelpA', '    HtmlHelpW')
              $defLines | Set-Content $def -Encoding ascii
              if ($arch -eq 'x64') {
                lib /NOLOGO /DEF:$def /MACHINE:X64 /OUT:$out
              } else {
                lib /NOLOGO /DEF:$def /MACHINE:X86 /OUT:$out
              }
            }
          }

      - name: Build 7zFM.exe (GUI, File Manager)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\Bundles\Fm
          nmake PLATFORM=x64

      - name: Build 7za.exe (standalone console for tests)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone
          nmake PLATFORM=x64

      - name: Build 7z.dll (all formats)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Format7zF
          nmake PLATFORM=x64

      - name: Build 7z.exe (console)
        shell: cmd
        run: |
          cd CPP\7zip\UI\Console
          nmake PLATFORM=x64

      - name: Build 7zG.exe (GUI client)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\UI\GUI
          nmake PLATFORM=x64

      - name: Build 7-zip.dll (shell extension, x64)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\UI\Explorer
          nmake PLATFORM=x64

      - name: Build SFX modules (7z.sfx, 7zCon.sfx)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\SFXWin
          nmake PLATFORM=x64
          cd ..\SFXCon
          nmake PLATFORM=x64

      - name: Build installer stub and uninstaller
        shell: cmd
        run: |
          cd C\Util\7zipInstall
          nmake PLATFORM=x64
          cd ..\7zipUninstall
          nmake PLATFORM=x64

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build 7-zip32.dll (x86 shell extension)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs\x86"
          cd CPP\7zip\UI\Explorer
          nmake

      - name: Collect binaries and payload files
        shell: cmd
        run: |
          mkdir _bin
          mkdir _payload
          copy CPP\7zip\Bundles\Fm\x64\7zFM.exe _bin\
          copy CPP\7zip\Bundles\Alone\x64\7za.exe _bin\
          copy CPP\7zip\Bundles\Format7zF\x64\7z.dll _payload\
          copy CPP\7zip\UI\Console\x64\7z.exe _payload\
          copy CPP\7zip\UI\GUI\x64\7zG.exe _payload\
          copy CPP\7zip\Bundles\Fm\x64\7zFM.exe _payload\
          copy CPP\7zip\UI\Explorer\x64\7-zip.dll _payload\
          copy CPP\7zip\UI\Explorer\o\7-zip.dll _payload\7-zip32.dll
          copy CPP\7zip\Bundles\SFXWin\x64\7z.sfx _payload\
          copy CPP\7zip\Bundles\SFXCon\x64\7zCon.sfx _payload\
          copy C\Util\7zipUninstall\x64\7zipUninstall.exe _payload\Uninstall.exe
          copy DOC\License.txt _payload\
          copy DOC\readme.txt _payload\
          copy DOC\src-history.txt _payload\History.txt

      - name: Assemble the installer (stub + appended 7z payload)
        shell: cmd
        run: |
          cd _payload
          ..\_bin\7za.exe a -t7z -mx=9 ..\_bin\payload.7z * > nul
          cd ..
          copy /b C\Util\7zipInstall\x64\7zipInstall.exe + _bin\payload.7z _bin\7z2603-smart-extract-x64.exe
          dir _bin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-smart-extract-x64
          path: |
            _bin/7zFM.exe
            _bin/7za.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-smart-extract-installer
          path: _bin/7z2603-smart-extract-x64.exe
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 7zip-smart-extract-x64
          path: _bin

      - name: Run smart extract tests
        shell: pwsh
        run: .github\workflows\test-smart-extract.ps1 -BinDir "$env:GITHUB_WORKSPACE\_bin"

      - name: Upload test details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-extract-test-output
          path: test-output/*
          if-no-files-found: ignore

  verify-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 7zip-smart-extract-installer
          path: _installer

      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "_installer\7z2603-smart-extract-x64.exe" -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $dir = Join-Path $env:ProgramFiles '7-Zip'
          foreach ($f in '7z.exe', '7z.dll', '7zFM.exe', '7zG.exe', '7-zip.dll', '7-zip32.dll', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $dir\$f" }
          }
          Write-Host "install files OK: $dir"
          if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\7-Zip')) {
            throw 'uninstall registry key missing'
          }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Classes\CLSID\{23170F69-40C1-278A-1000-000100020000}\InprocServer32')) {
            throw 'shell extension CLSID registry key missing'
          }
          Write-Host 'registry OK'

      - name: Verify installed 7z.exe works
        shell: pwsh
        run: |
          & "$env:ProgramFiles\7-Zip\7z.exe" i | Select-Object -First 6
          if ($LASTEXITCODE -ne 0) { throw "installed 7z.exe failed: $LASTEXITCODE" }

      - name: Uninstall silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:ProgramFiles\7-Zip\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Write-Host "uninstaller exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 2
          if (Test-Path "$env:ProgramFiles\7-Zip\7zFM.exe") { throw '7zFM.exe still present after uninstall' }
          Write-Host 'uninstall OK'
