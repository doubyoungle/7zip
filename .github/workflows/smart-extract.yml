name: smart-extract

on:
  push:
    branches:
      - 'feature/smart-extract'
  pull_request:
    branches:
      - 'feature/smart-extract'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare htmlhelp.lib (x64 and x86 import libraries for HtmlHelpW)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _libs\x86 | Out-Null
          $kitLib = "C:\Program Files (x86)\Windows Kits\10\Lib"
          foreach ($arch in @('x64', 'x86')) {
            $found = Get-ChildItem -Path $kitLib -Recurse -Filter "hhctrl.lib" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*\um\$arch*" } |
                     Sort-Object FullName -Descending | Select-Object -First 1
            $out = if ($arch -eq 'x64') { '_libs\htmlhelp.lib' } else { '_libs\x86\htmlhelp.lib' }
            if ($found) {
              Copy-Item $found.FullName $out
              Write-Host "$arch : copied htmlhelp import library from $($found.FullName)"
            } else {
              Write-Host "$arch : hhctrl.lib not found in Windows SDK, generating import library"
              $def = "_libs\hhctrl-$arch.def"
              $defLines = @('LIBRARY HHCTRL.OCX', 'EXPORTS', '    HtmlHelpA', '    HtmlHelpW')
              $defLines | Set-Content $def -Encoding ascii
              if ($arch -eq 'x64') {
                lib /NOLOGO /DEF:$def /MACHINE:X64 /OUT:$out
              } else {
                lib /NOLOGO /DEF:$def /MACHINE:X86 /OUT:$out
              }
            }
          }

      - name: Build 7zFM.exe (GUI, File Manager)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\Bundles\Fm
          nmake PLATFORM=x64

      - name: Build 7za.exe (standalone console for tests and packaging)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone
          nmake PLATFORM=x64

      - name: Build 7z.dll (all formats)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Format7zF
          nmake PLATFORM=x64

      - name: Build 7z.exe (console)
        shell: cmd
        run: |
          cd CPP\7zip\UI\Console
          nmake PLATFORM=x64

      - name: Build 7zG.exe (GUI client used by the shell extension)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\UI\GUI
          nmake PLATFORM=x64

      - name: Build 7-zip.dll (shell extension, x64)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs"
          cd CPP\7zip\UI\Explorer
          nmake PLATFORM=x64

      - name: Build SFX modules (7z.sfx, 7zCon.sfx)
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\SFXWin
          nmake PLATFORM=x64
          cd ..\SFXCon
          nmake PLATFORM=x64

      - name: Build installer stub (7zipInstall.exe) and uninstaller
        shell: cmd
        run: |
          cd C\Util\7zipInstall
          nmake PLATFORM=x64
          cd ..\7zipUninstall
          nmake PLATFORM=x64

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build 7-zip32.dll (x86 shell extension)
        shell: cmd
        run: |
          set "LIB=%LIB%;%CD%\_libs\x86"
          cd CPP\7zip\UI\Explorer
          nmake PLATFORM=x86

      - name: Collect binaries
        shell: cmd
        run: |
          mkdir _bin
          copy CPP\7zip\Bundles\Fm\x64\7zFM.exe _bin\
          copy CPP\7zip\Bundles\Alone\x64\7za.exe _bin\
          copy CPP\7zip\UI\GUI\x64\7zG.exe _bin\
          copy CPP\7zip\Bundles\Format7zF\x64\7z.dll _bin\
          copy CPP\7zip\UI\Console\x64\7z.exe _bin\
          copy CPP\7zip\UI\Explorer\x64\7-zip.dll _bin\
          copy CPP\7zip\UI\Explorer\x86\7-zip.dll _bin\7-zip32.dll
          dir _bin

      - name: Verify collected files
        if: always()
        shell: pwsh
        run: |
          $need = @('7zFM.exe', '7za.exe', '7zG.exe', '7z.dll', '7z.exe', '7-zip.dll', '7-zip32.dll')
          $missing = @($need | Where-Object { -not (Test-Path (Join-Path '_bin' $_)) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "::error::missing artifact file: $_" }
            $dirs = (Get-ChildItem 'CPP\7zip\UI\Explorer' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
            Write-Host "::error::Explorer subdirs: $dirs"
            foreach ($d in 'CPP\7zip\UI\Explorer\o', 'CPP\7zip\UI\Explorer\x64', 'CPP\7zip\UI\Console\x64', 'CPP\7zip\Bundles\Format7zF\x64', 'CPP\7zip\Bundles\Fm\x64') {
              if (Test-Path $d) {
                $names = (Get-ChildItem $d -File | ForEach-Object { $_.Name } | Select-Object -First 12) -join ', '
                Write-Host "::error::[$d]: $names"
              } else {
                Write-Host "::error::dir missing: $d"
              }
            }
            throw "missing files: $($missing -join ', ')"
          }
          Write-Host 'all collected files present'

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-smart-extract-x64
          path: |
            _bin/7zFM.exe
            _bin/7za.exe
            _bin/7zG.exe
            _bin/7z.dll
            _bin/7z.exe
            _bin/7-zip.dll
            _bin/7-zip32.dll
          if-no-files-found: error

      - name: Assemble the installer (stub + appended 7z payload)
        shell: cmd
        run: |
          mkdir _payload
          copy CPP\7zip\Bundles\Format7zF\x64\7z.dll _payload\ || (echo ::error::payload source missing: 7z.dll & exit /b 1)
          copy CPP\7zip\UI\Console\x64\7z.exe _payload\ || (echo ::error::payload source missing: 7z.exe & exit /b 1)
          copy CPP\7zip\UI\GUI\x64\7zG.exe _payload\ || (echo ::error::payload source missing: 7zG.exe & exit /b 1)
          copy CPP\7zip\Bundles\Fm\x64\7zFM.exe _payload\ || (echo ::error::payload source missing: 7zFM.exe & exit /b 1)
          copy CPP\7zip\UI\Explorer\x64\7-zip.dll _payload\ || (echo ::error::payload source missing: 7-zip.dll & exit /b 1)
          copy CPP\7zip\UI\Explorer\x86\7-zip.dll _payload\7-zip32.dll || (echo ::error::payload source missing: Explorer\x86\7-zip.dll & exit /b 1)
          copy CPP\7zip\Bundles\SFXWin\x64\7z.sfx _payload\ || (echo ::error::payload source missing: 7z.sfx & exit /b 1)
          copy CPP\7zip\Bundles\SFXCon\x64\7zCon.sfx _payload\ || (echo ::error::payload source missing: 7zCon.sfx & exit /b 1)
          copy C\Util\7zipUninstall\x64\7zipUninstall.exe _payload\Uninstall.exe || (echo ::error::payload source missing: Uninstall.exe & exit /b 1)
          copy DOC\License.txt _payload\ || (echo ::error::payload source missing: License.txt & exit /b 1)
          copy DOC\readme.txt _payload\ || (echo ::error::payload source missing: readme.txt & exit /b 1)
          copy DOC\src-history.txt _payload\History.txt || (echo ::error::payload source missing: src-history.txt & exit /b 1)
          if exist "%ProgramW6432%\7-Zip\7-zip.chm" copy "%ProgramW6432%\7-Zip\7-zip.chm" _payload\
          if exist "%ProgramW6432%\7-Zip\Lang" xcopy /E /I /Q "%ProgramW6432%\7-Zip\Lang" _payload\Lang\
          dir _payload
          cd _payload
          ..\_bin\7za.exe a -t7z -m0=lzma -mx9 -mf=off -ms=on ..\_bin\payload.7z * || (echo ::error::payload packaging failed & exit /b 1)
          ..\_bin\7za.exe l -slt ..\_bin\payload.7z > ..\_bin\payload-list.txt || (echo ::error::payload listing failed & exit /b 1)
          findstr /C:"LZMA2" ..\_bin\payload-list.txt >nul && (echo ::error::payload uses LZMA2, but the installer stub decodes LZMA1 only & exit /b 1)
          cd ..
          copy /b C\Util\7zipInstall\x64\7zipInstall.exe + _bin\payload.7z _bin\7z2603-smart-extract-x64.exe || (echo ::error::installer assembly failed & exit /b 1)
          dir _bin

      - name: List build outputs
        if: always()
        shell: pwsh
        run: |
          foreach ($d in 'CPP\7zip\Bundles\SFXWin\x64', 'CPP\7zip\Bundles\SFXCon\x64', 'C\Util\7zipInstall\x64', 'C\Util\7zipUninstall\x64', 'CPP\7zip\UI\Explorer\x86', '_payload') {
            if (Test-Path $d) {
              $names = (Get-ChildItem $d -File | ForEach-Object { $_.Name } | Select-Object -First 15) -join ', '
              Write-Host "output dir [$d]: $names"
            } else {
              Write-Host "output dir missing: $d"
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-smart-extract-installer
          path: _bin/7z2603-smart-extract-x64.exe
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 7zip-smart-extract-x64
          path: _bin

      - name: Run smart extract tests
        shell: pwsh
        run: .github\workflows\test-smart-extract.ps1 -BinDir "$env:GITHUB_WORKSPACE\_bin"

      - name: Upload test details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-extract-test-output
          path: test-output/*
          if-no-files-found: ignore

  verify-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 7zip-smart-extract-installer
          path: _installer

      - name: Remove preinstalled 7-Zip (clean slate for the test)
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles '7-Zip'
          $exe = Join-Path $dir '7z.exe'
          if (Test-Path $exe) {
            $old = (Get-Item $exe).VersionInfo.FileVersion
            Write-Host "::notice::preexisting 7-Zip version: $old"
            $un = Join-Path $dir 'Uninstall.exe'
            if (Test-Path $un) {
              $u = Start-Process -FilePath $un -ArgumentList '/S' -Wait -PassThru
              Write-Host "preexisting uninstaller exit code: $($u.ExitCode)"
            } else {
              Write-Host '::warning::preexisting 7-Zip has no Uninstall.exe'
            }
            Start-Sleep -Seconds 3
            if (Test-Path $exe) {
              Write-Host '::warning::preexisting 7z.exe still present after silent uninstall'
            } else {
              Write-Host 'preexisting 7-Zip removed'
            }
          } else {
            Write-Host 'no preexisting 7-Zip found'
          }

      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "_installer\7z2603-smart-extract-x64.exe" -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $dir = Join-Path $env:ProgramFiles '7-Zip'
          $failures = New-Object System.Collections.Generic.List[string]
          if ($p.ExitCode -ne 0) { $failures.Add("installer exit code: $($p.ExitCode)") }
          foreach ($f in '7z.exe', '7z.dll', '7zFM.exe', '7zG.exe', '7-zip.dll', '7-zip32.dll', '7z.sfx', '7zCon.sfx', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { $failures.Add("missing after install: $f") }
          }
          $sevenExe = Join-Path $dir '7z.exe'
          if (Test-Path $sevenExe) {
            $item = Get-Item $sevenExe
            $ver = $item.VersionInfo.FileVersion
            Write-Host "::notice::installed 7z.exe version: $ver, size: $($item.Length)"
            if ($ver -notlike '26.*') { $failures.Add("installed 7z.exe is not our build, version: $ver") }
          }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\7-Zip')) { $failures.Add('uninstall registry key missing') }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Classes\CLSID\{23170F69-40C1-278A-1000-000100020000}\InprocServer32')) { $failures.Add('shell extension CLSID registry key missing') }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            throw ($failures -join '; ')
          }
          Write-Host 'install checks OK'

      - name: Smoke-test the installed 7z.exe (smart extract end to end)
        shell: pwsh
        run: |
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          $t = Join-Path $env:RUNNER_TEMP 'smetest'
          if (Test-Path $t) { Remove-Item $t -Recurse -Force }
          New-Item -ItemType Directory -Force $t | Out-Null
          Push-Location $t
          try {
            Set-Content a.txt 'a'
            Set-Content b.txt 'b'
            $log1 = & $seven a multi.zip a.txt b.txt 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::creating the test archive failed, exit code: $LASTEXITCODE"
              Write-Host $log1
              throw 'archive creation failed'
            }
            New-Item -ItemType Directory -Force out | Out-Null
            Copy-Item multi.zip out\
            Push-Location out
            try {
              $log2 = & $seven x -sme multi.zip -y 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::installed 7z.exe x -sme failed, exit code: $LASTEXITCODE"
                Write-Host $log2
                throw 'x -sme failed'
              }
              if (-not (Test-Path 'multi\a.txt')) {
                $listing = (Get-ChildItem -Recurse | ForEach-Object { $_.FullName }) -join '; '
                Write-Host "::error::smart extract produced a wrong layout, contents: $listing"
                Write-Host $log2
                throw 'wrong layout'
              }
              Write-Host 'installed 7z.exe smart extract OK'
            }
            finally { Pop-Location }
          }
          finally { Pop-Location }

      - name: Uninstall silently
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles '7-Zip'
          $p = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          Write-Host "uninstaller exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir '7zFM.exe')) {
            Write-Host '::error::7zFM.exe still present after uninstall'
            throw 'still present after uninstall'
          }
          Write-Host 'uninstall OK'
